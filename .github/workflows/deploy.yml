name: Marketing Pages (disabled)

# radiofrequency/buzzftw is Buzz product only.
# Folstad marketing lives in private radiofrequency/folstad.ca.
# The folstad-pages branch is a historical snapshot — do not delete it from GitHub.
# Do not re-enable actions/deploy-pages from this repo. That path used to publish
# www.folstad.ca / GitHub Pages from the old folstad-site monorepo.
#
# Buzz control plane: laptop `cd infra && npx cdk deploy` (existing AWS creds).
# Buzz relay: packages/buzz-platform (see MIGRATION.md).

on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse marketing / GitHub Pages deploy
        run: |
          echo "Marketing is not deployed from radiofrequency/buzzftw."
          echo "Use radiofrequency/folstad.ca for the Folstad marketing site."
          echo "Buzz control plane: cd infra && npx cdk deploy"
          echo "Buzz relay: packages/buzz-platform (MIGRATION.md)"
          echo "Leave the folstad-pages branch on GitHub for humans."
